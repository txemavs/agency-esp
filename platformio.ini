; PlatformIO Project Configuration File
; Agency desk status cube for M5Stack AtomS3
;
; ESP32-S3FN8: 8MB flash, NO PSRAM
; USB CDC enabled for serial monitor
; pioarduino platform (Arduino-ESP32 3.x with USB CDC support)

[env:atoms3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Flash configuration for 8MB
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

; USB CDC on boot (required for AtomS3 USB serial)
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; No PSRAM flags - AtomS3 has no PSRAM
    -DCORE_DEBUG_LEVEL=1

; Upload/monitor settings
upload_speed = 1500000
monitor_speed = 115200

; Libraries
lib_deps =
    m5stack/M5Unified@^0.2.3
    https://github.com/tzapu/WiFiManager.git#v2.0.17
